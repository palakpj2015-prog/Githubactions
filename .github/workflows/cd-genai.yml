  # ---------------------------------------------------------
  # 4. GENAI PIPELINE ANALYSIS
  # ---------------------------------------------------------
  genai-summary:
    name: Generate GenAI Summary

    needs:
      - test
      - terraform-plan
      - docker-push

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pipeline logs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-logs"
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI dependency
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Build AI context
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-plan.result }}
          DOCKER_RESULT: ${{ needs.docker-push.result }}
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            echo "Commit message: ${{ github.event.head_commit.message }}"
            echo "AWS Region: ${{ env.AWS_REGION }}"
            echo "ECR Repository: ${{ env.ECR_REPOSITORY }}"
            echo "Image tag: ${{ env.IMAGE_TAG }}"
            echo "Test result: ${TEST_RESULT}"
            echo "Terraform result: ${TERRAFORM_RESULT}"
            echo "Docker result: ${DOCKER_RESULT}"
          } > poc-context.txt

      - name: Generate AI release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/genai_release_notes.py

      - name: Generate AI log summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/genai_summarize_logs.py

      - name: Upload AI outputs
        uses: actions/upload-artifact@v4
        with:
          name: ai-outputs
          path: |
            ai-release-notes.md
            ai-log-summary.md
            poc-context.txt