name: CD - Docker ECR Terraform GenAI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: githubactions-genai-poc
  IMAGE_TAG: ${{ github.sha }}
  OLLAMA_MODEL: qwen2.5:0.5b

jobs:

  # =========================================================
  # 1. APPLICATION TESTS
  # =========================================================

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: |
          pytest app/ -v 2>&1 | tee workflow-logs.txt

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: workflow-logs.txt


  # =========================================================
  # 2. TERRAFORM PLAN
  # =========================================================

  terraform-plan:
    name: Terraform Plan
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform -chdir=terraform init

      - name: Terraform validate
        run: |
          terraform -chdir=terraform validate

      - name: Terraform plan
        run: |
          terraform -chdir=terraform plan -no-color 2>&1 | tee terraform-plan.log

      - name: Upload Terraform logs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-logs
          path: terraform-plan.log


  # =========================================================
  # 3. DOCKER BUILD AND ECR PUSH
  # =========================================================

  docker-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}


  # =========================================================
  # 4. GENAI ANALYSIS
  # =========================================================

  genai-summary:
    name: Generate GenAI Summary

    needs:
      - test
      - terraform-plan
      - docker-push

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Download logs from previous jobs
      # -------------------------------------------------------

      - name: Download pipeline logs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-logs"
          merge-multiple: true

      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------------
      # Install Ollama
      # -------------------------------------------------------

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # -------------------------------------------------------
      # Start Ollama
      # -------------------------------------------------------

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              break
            fi

            sleep 2
          done

      # -------------------------------------------------------
      # Download small local AI model
      # -------------------------------------------------------

      - name: Download local AI model
        run: |
          ollama pull "${OLLAMA_MODEL}"

      # -------------------------------------------------------
      # Verify model
      # -------------------------------------------------------

      - name: Verify local AI model
        run: |
          ollama list

      # -------------------------------------------------------
      # Build pipeline context
      # -------------------------------------------------------

      - name: Build AI context
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TERRAFORM_RESULT: ${{ needs.terraform-plan.result }}
          DOCKER_RESULT: ${{ needs.docker-push.result }}
        run: |
          {
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Actor: ${{ github.actor }}"
            echo "Commit message: ${{ github.event.head_commit.message }}"
            echo "AWS Region: ${{ env.AWS_REGION }}"
            echo "ECR Repository: ${{ env.ECR_REPOSITORY }}"
            echo "Image tag: ${{ env.IMAGE_TAG }}"
            echo "Test result: ${TEST_RESULT}"
            echo "Terraform result: ${TERRAFORM_RESULT}"
            echo "Docker result: ${DOCKER_RESULT}"
          } > poc-context.txt

      # -------------------------------------------------------
      # Generate AI release notes
      # -------------------------------------------------------

      - name: Generate AI release notes
        run: |
          python scripts/genai_release_notes.py

      # -------------------------------------------------------
      # Generate AI log summary
      # -------------------------------------------------------

      - name: Generate AI log summary
        run: |
          python scripts/genai_summarize_logs.py

      # -------------------------------------------------------
      # Upload AI-generated outputs
      # -------------------------------------------------------

      - name: Upload AI outputs
        uses: actions/upload-artifact@v4
        with:
          name: ai-outputs
          path: |
            ai-release-notes.md
            ai-log-summary.md
            poc-context.txt

      # -------------------------------------------------------
      # Show AI output in workflow logs
      # -------------------------------------------------------

      - name: Display AI outputs
        run: |
          echo "========================================="
          echo "AI RELEASE NOTES"
          echo "========================================="
          cat ai-release-notes.md

          echo ""
          echo "========================================="
          echo "AI PIPELINE LOG SUMMARY"
          echo "========================================="
          cat ai-log-summary.md